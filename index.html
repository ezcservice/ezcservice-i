<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Selection</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    background:#f2f2f2;
}

.container{
    max-width:450px;
    margin:auto;
    padding:15px;
}

/* Popup */
.popup{
    background:#fff;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.popup p{
    font-size:15px;
}

.popup-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.popup button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:15px;
    color:#fff;
    background:#007bff;
}

/* Sections */
.section{
    display:none;
    margin-top:20px;
}

.section h3{
    margin-bottom:15px;
    font-size:17px;
}

/* Payment buttons */
.pay-btn{
    display:flex;
    align-items:center;
    gap:12px;
    width:100%;
    padding:14px;
    margin-bottom:10px;
    border:none;
    border-radius:10px;
    font-size:16px;
    color:#fff;
}

.pay-btn img{
    width:35px;
    height:35px;
    background:#fff;
    border-radius:6px;
    padding:4px;
}

/* Bank colors */
.sampath{background:#b40000;}
.boc{background:#0033a0;}
.combank{background:#006a4e;}
.payngo{background:#ff6600;}
.ndb{background:#ed1c24;}
.ipay{background:#5a2d82;}

.offline{background:#444;}
</style>
</head>

<body>

<div class="container">

<!-- Login Popup -->
<div class="popup" id="loginPopup">
    <p>
        ඔබ පේමන්ට් එක කරන්නේ Online Transfer හරහාද?<br>
        නැතිනම් පිටතින්?<br><br>
        <strong>
        Are you making the payment via Online Transfer or Offline?
        </strong>
    </p>

    <div class="popup-buttons">
        <button onclick="showOnline()">
            Online Transfer<br>ඔන්ලයින්
        </button>
        <button onclick="showOffline()">
            Offline Payment<br>පිටතින්
        </button>
    </div>
</div>

<!-- Online Section -->
<div class="section" id="onlineSection">
<h3>Online Transfer යටතේ ගෙවීම් කළ හැකි Bank</h3>

<button class="pay-btn sampath" onclick="sendWhatsApp('Sampath Vishwa')">
<img src="https://upload.wikimedia.org/wikipedia/en/3/3b/Sampath_Bank_logo.png">
Sampath Vishwa
</button>

<button class="pay-btn boc" onclick="sendWhatsApp('BOC Flex')">
<img src="https://upload.wikimedia.org/wikipedia/en/7/77/Bank_of_Ceylon_logo.png">
BOC Flex
</button>

<button class="pay-btn combank" onclick="sendWhatsApp('Commercial Bank App')">
<img src="https://upload.wikimedia.org/wikipedia/en/9/94/Commercial_Bank_Sri_Lanka_logo.png">
Commercial Bank App
</button>

<button class="pay-btn payngo" onclick="sendWhatsApp('Pay and Go')">
<img src="https://cdn-icons-png.flaticon.com/512/825/825454.png">
Pay and Go
</button>

<button class="pay-btn ndb" onclick="sendWhatsApp('NDB App')">
<img src="https://upload.wikimedia.org/wikipedia/en/5/5f/National_Development_Bank_logo.png">
NDB App
</button>

<button class="pay-btn ipay" onclick="sendWhatsApp('iPay App')">
<img src="https://cdn-icons-png.flaticon.com/512/825/825423.png">
iPay App
</button>
</div>

<!-- Offline Section -->
<div class="section" id="offlineSection">
<h3>Offline Payment Methods</h3>

<button class="pay-btn offline" onclick="sendWhatsApp('Food City')">
<img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png">
Food City
</button>

<button class="pay-btn offline" onclick="sendWhatsApp('Pay and Go Machine')">
<img src="https://cdn-icons-png.flaticon.com/512/3595/3595455.png">
Pay and Go Machine
</button>

<button class="pay-btn offline" onclick="sendWhatsApp('Communication Shop')">
<img src="https://cdn-icons-png.flaticon.com/512/3050/3050525.png">
Communication Shop
</button>

<button class="pay-btn offline" onclick="sendWhatsApp('Dialog Arcade')">
<img src="https://upload.wikimedia.org/wikipedia/en/7/75/Dialog_Axiata_logo.png">
Dialog Arcade
</button>

<button class="pay-btn offline" onclick="sendWhatsApp('Singer Outlet')">
<img src="https://upload.wikimedia.org/wikipedia/en/6/6e/Singer_Sri_Lanka_logo.png">
Singer Outlet
</button>
</div>

</div>

<script>
function showOnline(){
    document.getElementById("loginPopup").style.display="none";
    document.getElementById("onlineSection").style.display="block";
}

function showOffline(){
    document.getElementById("loginPopup").style.display="none";
    document.getElementById("offlineSection").style.display="block";
}

function sendWhatsApp(method){
    let phone = "94XXXXXXXXX"; // Your WhatsApp number
    let message =
`Payment Method Selected

Method: ${method}

ඔබ තෝරාගත් ගෙවීම් ක්‍රමය:
${method}`;
    window.open(
      "https://wa.me/"+phone+"?text="+encodeURIComponent(message),
      "_blank"
    );
}
</script>

</body>
</html>
