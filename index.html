<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Selection System</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    background:#f2f2f2;
}

.container{
    max-width:450px;
    margin:auto;
    padding:15px;
}

/* Popup */
.popup{
    background:#ffffff;
    padding:20px;
    border-radius:10px;
    text-align:center;
    box-shadow:0 0 10px rgba(0,0,0,0.1);
}

.popup p{
    font-size:15px;
}

.popup-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.popup button{
    flex:1;
    padding:12px;
    border:none;
    border-radius:8px;
    font-size:16px;
    color:#fff;
    background:#007bff;
}

/* Sections */
.section{
    display:none;
    margin-top:20px;
}

.section h3{
    margin-bottom:15px;
    font-size:17px;
}

/* Buttons */
button{
    width:100%;
    padding:14px;
    margin-bottom:10px;
    border:none;
    border-radius:8px;
    font-size:16px;
    color:#fff;
}

/* Bank colors */
.sampath{background:#b40000;}
.boc{background:#0033a0;}
.combank{background:#006a4e;}
.payngo{background:#ff6600;}
.ndb{background:#ed1c24;}
.ipay{background:#5a2d82;}

/* Offline buttons */
.offline{background:#444;}

</style>
</head>

<body>

<div class="container">

    <!-- Login Success Popup -->
    <div class="popup" id="loginPopup">
        <p>
            ඔබ පේමන්ට් එක කරන්නේ Online Transfer හරහාද?<br>
            නැතිනම් පිටතින්?<br><br>
            <strong>
                Are you making the payment via Online Transfer or Offline?
            </strong>
        </p>

        <div class="popup-buttons">
            <button onclick="showOnline()">Online Transfer</button>
            <button onclick="showOffline()">Offline</button>
        </div>
    </div>

    <!-- Online Payment Section -->
    <div class="section" id="onlineSection">
        <h3>Online Transfer යටතේ ගෙවීම් කළ හැකි Bank</h3>

        <button class="sampath" onclick="sendWhatsApp('Sampath Vishwa')">Sampath Vishwa</button>
        <button class="boc" onclick="sendWhatsApp('BOC Flex')">BOC Flex</button>
        <button class="combank" onclick="sendWhatsApp('Commercial Bank App')">Commercial Bank App</button>
        <button class="payngo" onclick="sendWhatsApp('Pay and Go')">Pay and Go</button>
        <button class="ndb" onclick="sendWhatsApp('NDB App')">NDB App</button>
        <button class="ipay" onclick="sendWhatsApp('iPay App')">iPay App</button>
    </div>

    <!-- Offline Payment Section -->
    <div class="section" id="offlineSection">
        <h3>Offline Payment Methods</h3>

        <button class="offline" onclick="sendWhatsApp('Food City')">Food City</button>
        <button class="offline" onclick="sendWhatsApp('Pay and Go Machine')">Pay and Go Machine</button>
        <button class="offline" onclick="sendWhatsApp('Communication Shop')">Communication Shop</button>
        <button class="offline" onclick="sendWhatsApp('Dialog Arcade')">Dialog Arcade</button>
        <button class="offline" onclick="sendWhatsApp('Singer Outlet')">Singer Outlet</button>
    </div>

</div>

<script>
function showOnline(){
    document.getElementById("loginPopup").style.display="none";
    document.getElementById("onlineSection").style.display="block";
}

function showOffline(){
    document.getElementById("loginPopup").style.display="none";
    document.getElementById("offlineSection").style.display="block";
}

function sendWhatsApp(method){
    let phone = "94XXXXXXXXX"; // WhatsApp number
    let message = 
`Payment Method Selected
--------------------------------
Method: ${method}

ඔබ තෝරාගත් ගෙවීම් ක්‍රමය: ${method}`;
    
    let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);
    window.open(url,"_blank");
}
</script>

</body>
</html>
