<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Payment Selection</title>

<style>
*{
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    margin:0;
    background:#f2f2f2;
}

.container{
    max-width:450px;
    margin:auto;
    padding:15px;
}

/* Popup */
.popup{
    background:#fff;
    padding:20px;
    border-radius:12px;
    text-align:center;
    box-shadow:0 5px 15px rgba(0,0,0,0.15);
}

.popup-buttons{
    display:flex;
    gap:10px;
    margin-top:15px;
}

.popup button{
    flex:1;
    padding:14px;
    border:none;
    border-radius:10px;
    font-size:15px;
    color:#fff;
    background:#007bff;
}

/* Sections */
.section{
    display:none;
    margin-top:20px;
}

.section h3{
    margin-bottom:15px;
}

/* Back button */
.back-btn{
    background:#666;
    margin-bottom:15px;
}

/* Payment buttons */
.pay-btn{
    display:flex;
    align-items:center;
    gap:15px;
    width:100%;
    padding:15px;
    margin-bottom:12px;
    border:none;
    border-radius:12px;
    font-size:16px;
    color:#fff;
}

.pay-btn img{
    width:45px;
    height:45px;
    background:#fff;
    border-radius:8px;
    padding:5px;
}

/* Online colors */
.sampath{background:#b40000;}
.boc{background:#0033a0;}
.combank{background:#006a4e;}
.payngo{background:#ff6600;}
.ndb{background:#ed1c24;}
.ipay{background:#5a2d82;}

/* Offline colors */
.foodcity{background:#2e7d32;}
.payngom{background:#ef6c00;}
.commshop{background:#1565c0;}
.dialog{background:#d32f2f;}
.singer{background:#424242;}

/* Loading overlay */
.loading{
    display:none;
    position:fixed;
    top:0; left:0;
    width:100%;
    height:100%;
    background:rgba(0,0,0,0.6);
    color:#fff;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    z-index:999;
}

.spinner{
    width:50px;
    height:50px;
    border:6px solid #ddd;
    border-top:6px solid #00e676;
    border-radius:50%;
    animation:spin 1s linear infinite;
    margin-bottom:15px;
}

@keyframes spin{
    0%{transform:rotate(0deg);}
    100%{transform:rotate(360deg);}
}
</style>
</head>

<body>

<div class="container">

<!-- First Popup -->
<div class="popup" id="loginPopup">
    <p>
        ඔබ පේමන්ට් එක කරන්නේ Online Transfer හරහාද?<br>
        නැතිනම් පිටතින්?<br><br>
        <strong>
        Are you making the payment via Online Transfer or Offline?
        </strong>
    </p>

    <div class="popup-buttons">
        <button onclick="showOnline()">Online Transfer<br>ඔන්ලයින්</button>
        <button onclick="showOffline()">Offline Payment<br>පිටතින්</button>
    </div>
</div>

<!-- Online Section -->
<div class="section" id="onlineSection">
<button class="pay-btn back-btn" onclick="goBack()">⬅ Back</button>
<h3>Online Transfer Banks</h3>

<button class="pay-btn sampath" onclick="selectMethod('Sampath Vishwa')">
<img src="https://upload.wikimedia.org/wikipedia/en/3/3b/Sampath_Bank_logo.png">
Sampath Vishwa
</button>

<button class="pay-btn boc" onclick="selectMethod('BOC Flex')">
<img src="https://upload.wikimedia.org/wikipedia/en/7/77/Bank_of_Ceylon_logo.png">
BOC Flex
</button>

<button class="pay-btn combank" onclick="selectMethod('Commercial Bank App')">
<img src="https://upload.wikimedia.org/wikipedia/en/9/94/Commercial_Bank_Sri_Lanka_logo.png">
Commercial Bank App
</button>

<button class="pay-btn payngo" onclick="selectMethod('Pay and Go')">
<img src="https://cdn-icons-png.flaticon.com/512/825/825454.png">
Pay and Go
</button>

<button class="pay-btn ndb" onclick="selectMethod('NDB App')">
<img src="https://upload.wikimedia.org/wikipedia/en/5/5f/National_Development_Bank_logo.png">
NDB App
</button>

<button class="pay-btn ipay" onclick="selectMethod('iPay App')">
<img src="https://cdn-icons-png.flaticon.com/512/825/825423.png">
iPay App
</button>
</div>

<!-- Offline Section -->
<div class="section" id="offlineSection">
<button class="pay-btn back-btn" onclick="goBack()">⬅ Back</button>
<h3>Offline Payment Methods</h3>

<button class="pay-btn foodcity" onclick="selectMethod('Food City')">
<img src="https://cdn-icons-png.flaticon.com/512/3075/3075977.png">
Food City
</button>

<button class="pay-btn payngom" onclick="selectMethod('Pay and Go Machine')">
<img src="https://cdn-icons-png.flaticon.com/512/3595/3595455.png">
Pay and Go Machine
</button>

<button class="pay-btn commshop" onclick="selectMethod('Communication Shop')">
<img src="https://cdn-icons-png.flaticon.com/512/3050/3050525.png">
Communication Shop
</button>

<button class="pay-btn dialog" onclick="selectMethod('Dialog Arcade')">
<img src="https://upload.wikimedia.org/wikipedia/en/7/75/Dialog_Axiata_logo.png">
Dialog Arcade
</button>

<button class="pay-btn singer" onclick="selectMethod('Singer Outlet')">
<img src="https://upload.wikimedia.org/wikipedia/en/6/6e/Singer_Sri_Lanka_logo.png">
Singer Outlet
</button>
</div>

</div>

<!-- Loading Screen -->
<div class="loading" id="loading">
    <div class="spinner"></div>
    <p>
        විස්තර WhatsApp වෙත යවමින් පවතී...<br>
        Sending details to WhatsApp...
    </p>
</div>

<script>
const phone = "94742089009";

function hideAll(){
    loginPopup.style.display="none";
    onlineSection.style.display="none";
    offlineSection.style.display="none";
}

function showOnline(){
    hideAll();
    onlineSection.style.display="block";
}

function showOffline(){
    hideAll();
    offlineSection.style.display="block";
}

function goBack(){
    hideAll();
    loginPopup.style.display="block";
}

function selectMethod(method){

    // Show loading UI
    document.getElementById("loading").style.display="flex";

    let message =
`Payment Method Selected
-----------------------
Method: ${method}

ඔබ තෝරාගත් ගෙවීම් ක්‍රමය:
${method}`;

    let url = "https://wa.me/" + phone + "?text=" + encodeURIComponent(message);

    // IMPORTANT: open WhatsApp immediately (no popup block)
    window.open(url, "_blank");

    // Hide loading after short delay (UI only)
    setTimeout(()=>{
        document.getElementById("loading").style.display="none";
    }, 2000);
}
</script>

</body>
</html>
